name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  api-tests:
    name: API (Laravel) — Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tixnova-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('tixnova-api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  # Catatan: tixnova-web adalah gitlink tanpa .gitmodules sehingga tidak dapat
  # di-checkout oleh GitHub Actions dari repo ini. Web CI akan diaktifkan setelah
  # submodule diregistrasi di .gitmodules (lihat docs/MASTER_BLUEPRINT.md Fase 1).
  # Lokal: cd tixnova-web && npm ci && npm run lint
